<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Página de Cleo Vieira da Silva para a Atividade Virtual 2.">
  <title>Cleo Vieira da Silva</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f6fa; color: #18324a; }
    main { width: min(92vw, 680px); padding: clamp(2rem, 6vw, 4rem); background: white; border: 1px solid #dce6ee; border-radius: 18px; box-shadow: 0 16px 40px rgba(18, 49, 74, .08); }
    .eyebrow { margin: 0 0 1rem; color: #426a86; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .78rem; }
    h1 { margin: 0; font-size: clamp(2.1rem, 6vw, 3.6rem); line-height: 1.1; }
    p { font-size: 1.08rem; line-height: 1.65; }
    .rule { width: 64px; height: 4px; margin: 1.8rem 0; background: #2c779e; border-radius: 4px; }
    footer { margin-top: 2.5rem; color: #536b7d; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Atividade Virtual 2</p>
    <h1>Cleo Vieira da Silva</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Esta é uma página estática publicada como exercício de versionamento com Git e deploy na Vercel.</p>
    <footer>Git · GitHub · Vercel</footer>
  </main>
</body>
</html>
